{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="panel-form">
        <h2 class="auth-heading">Sign in</h2>
        <p class="auth-subtext">Use your staff or admin account.</p>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Sign in</button>
        </form>
    </div>
    <div class="panel-promo">
        <h2>New here?</h2>
        <p>Register a staff account to start logging borrowings and returns.</p>
        <a href="{{ url_for('auth.register') }}" class="btn auth-switch">Create account</a>
    </div>
</div>
{% endblock %}
