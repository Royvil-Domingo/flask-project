{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">403</h1>
    <p class="lead">You don't have permission to access this page.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">Go Back</a>
</div>
{% endblock %}
