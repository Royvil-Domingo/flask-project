{% extends "base.html" %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">400</h1>
    <p class="lead">The request could not be understood by the server.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">Go Back</a>
</div>
{% endblock %}
