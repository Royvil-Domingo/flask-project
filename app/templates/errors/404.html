{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">404</h1>
    <p class="lead">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">Go Back</a>
</div>
{% endblock %}
