{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">500</h1>
    <p class="lead">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">Go Back</a>
</div>
{% endblock %}
