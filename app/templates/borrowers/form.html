{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Borrower{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ 'Edit' if item else 'Register' }} Borrower</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ item.name if item else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="contact" class="form-label">Contact (phone or email)</label>
                        <input type="text" class="form-control" id="contact" name="contact" value="{{ item.contact if item else '' }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if item else 'Register Borrower' }}</button>
                    <a href="{{ url_for('borrowers.list_borrowers') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
